<style>
  :root{
    --red: #E4002B;
    --red-dark: #A5001F;
    --paper: #F2EEE3;
    --paper-dim: #E7E1D2;
    --iron: #24272A;
    --iron-soft: #3B3F42;
    --forest: #16231A;
    --steel: #8B929A;
    --steel-line: #C9C3B4;
    --rust: #C0662E;
    --ok-green: #2F6B44;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--iron);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
  }

  /* ---------- Header ---------- */
  .hero{
    background: var(--forest);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(228,0,43,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(228,0,43,0.10), transparent 50%);
    color: var(--paper);
    padding: 26px 22px 22px;
    position: relative;
    border-bottom: 6px solid var(--red);
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
  }
  .hero .logo-plaque{
    order: 2;
    flex: 0 0 auto;
    width: 96px; height: 96px;
    border-radius: 12px;
    background: var(--red);
    border: 2px solid var(--iron-soft);
    box-shadow: 0 2px 0 rgba(0,0,0,0.35), inset 0 0 0 2px rgba(255,255,255,0.06);
    overflow: hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .hero .logo-plaque img{
    width: 100%; height: 100%; object-fit: cover; display:block;
  }
  .hero .hero-text{ order: 1; flex: 1; min-width:0; }
  .hero .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--red);
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .hero .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;background:var(--red);
    box-shadow: 0 0 8px var(--red);
  }
  .hero h1{
    font-family:'Anton', sans-serif;
    font-weight: 400;
    font-size: 42px;
    line-height: 0.92;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  .hero h1 span{ color: var(--red); }
  .hero p{
    margin: 0;
    font-size: 13.5px;
    color: var(--steel-line);
    max-width: 40ch;
  }
  .rivet{
    position:absolute;
    width:9px;height:9px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #cfd4d8, #6b7278 70%);
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.5);
  }
  .rivet.tl{top:12px;left:12px;} .rivet.tr{top:12px;right:12px;}
  .rivet.bl{bottom:12px;left:12px;} .rivet.br{bottom:12px;right:12px;}

  /* ---------- Identity bar ---------- */
  .idbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 22px;
    background: var(--iron);
    color: var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }
  .idbar b{ color: var(--red); font-weight:600; }
  .idbar-actions{ display:flex; gap: 6px; }
  .idbar button{
    background:none; border: 1px solid var(--steel); color: var(--steel-line);
    font-family:'IBM Plex Mono', monospace; font-size: 11px;
    padding: 4px 9px; border-radius: 3px; cursor:pointer;
  }
  .idbar button:hover{ border-color: var(--red); color: var(--red); }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    background: var(--iron-soft);
    padding: 0 14px;
    gap: 4px;
    position: sticky; top:0; z-index: 5;
  }
  .tab{
    flex:1;
    text-align:center;
    padding: 13px 6px 11px;
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size: 14px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--steel-line);
    background: transparent;
    border:none;
    border-bottom: 3px solid transparent;
    cursor: pointer;
  }
  .tab.active{
    color: var(--paper);
    border-bottom-color: var(--red);
  }

  /* ---------- Content ---------- */
  .content{ padding: 18px 16px 60px; }
  .spieltag-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--steel);
    display:flex; align-items:center; gap:10px;
    margin: 22px 0 10px;
  }
  .spieltag-label:first-child{ margin-top:4px; }
  .spieltag-label::after{
    content:''; flex:1; height:1px; background: var(--steel-line);
  }

  /* ---------- Sondertipp ---------- */
  .sonder-card{
    position:relative;
    background: var(--iron);
    color: var(--paper);
    border-radius: 8px;
    padding: 16px 16px 18px;
    margin-bottom: 18px;
    border: 1px solid var(--iron-soft);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .sonder-badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--rust);
    border: 1px solid var(--rust);
    border-radius: 20px;
    padding: 2px 9px;
    margin-bottom: 8px;
  }
  .sonder-title{
    font-family:'Anton', sans-serif; font-size: 19px; text-transform:uppercase;
    letter-spacing:0.01em; margin-bottom: 3px;
  }
  .sonder-sub{
    font-family:'IBM Plex Mono', monospace; font-size: 10.5px;
    color: var(--steel-line); margin-bottom: 12px; line-height:1.5;
  }
  .sonder-select-row select{
    width: 100%; padding: 12px 10px;
    font-family:'IBM Plex Mono', monospace; font-size: 15px; font-weight:600;
    border: 1.5px solid var(--steel); border-radius:5px;
    background: var(--paper); color: var(--iron);
  }
  .sonder-card .locked-row{ background: rgba(255,255,255,0.05); border-color: var(--steel); }
  .sonder-card .locked-msg{ color: var(--steel-line); }
  .sonder-card .locked-tip{ color: var(--paper); }
  .sonder-card .result-final{ border-top-color: var(--steel); }
  .sonder-card .yourtip{ color: var(--steel-line); }

  /* ---------- Match plaque ---------- */
  .plaque{
    position:relative;
    background: #FBF9F3;
    border: 1px solid var(--steel-line);
    border-radius: 6px;
    padding: 14px 16px 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
  }
  .plaque .meta{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--steel);
    margin-bottom: 10px;
  }
  .plaque .teams{
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
  }
  .team{
    font-weight: 600; font-size: 14.5px; line-height:1.25;
    flex: 1;
  }
  .team.union{ color: var(--red); }
  .team.away-align{ text-align:right; }
  .vs{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--steel); padding: 0 2px;
  }
  .score-row{
    display:flex; align-items:center; justify-content:center; gap: 10px;
    margin-top: 12px; flex-wrap: wrap;
  }
  .score-row input{
    width: 46px; height: 46px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 20px; font-weight:600;
    border: 1.5px solid var(--iron-soft);
    border-radius: 5px;
    background: var(--paper);
    color: var(--iron);
  }
  .score-row input:focus{ outline:none; border-color: var(--red); background:#fff; }
  .score-row .colon{ font-family:'Anton',sans-serif; font-size: 20px; color: var(--steel); }
  .tip-save-btn{
    background: var(--iron); color:#fff; border:none;
    font-family:'IBM Plex Mono', monospace; font-size: 11px;
    padding: 10px 14px; border-radius: 5px; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .tip-save-btn:hover{ background: var(--red); }
  .tip-save-btn.saved{ background: var(--ok-green); }
  .tip-save-btn.error{ background: var(--rust); }

  .rivet-status{
    position:absolute; top:12px; right:12px;
    width: 11px; height: 11px; border-radius:50%;
    border: 1.5px solid var(--steel);
    background: transparent;
  }
  .rivet-status.set{
    background: var(--iron-soft);
    border-color: var(--iron-soft);
  }
  .rivet-status.hit{
    background: var(--rust);
    border-color: var(--rust);
    box-shadow: 0 0 7px rgba(192,102,46,0.7);
  }

  .result-final{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--steel-line);
  }
  .result-final .score{
    font-family:'Anton', sans-serif; font-size: 24px; letter-spacing: 0.05em;
  }
  .result-final .yourtip{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--steel);
  }
  .locked-row{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    margin-top: 12px; padding: 12px 10px;
    background: var(--paper-dim);
    border: 1px dashed var(--steel-line);
    border-radius: 5px;
  }
  .locked-row .locked-msg{
    font-family:'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--steel); text-transform:uppercase; letter-spacing:0.03em;
    text-align:center;
  }
  .locked-row .locked-tip{
    font-family:'IBM Plex Mono', monospace; font-size: 12.5px;
    color: var(--iron-soft); font-weight:600;
  }
  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; font-weight:600;
    padding: 4px 9px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.04em;
    white-space:nowrap;
  }
  .badge.p4{ background: var(--rust); color:#fff; }
  .badge.p3{ background: var(--red); color:#fff; }
  .badge.p2{ background: var(--iron-soft); color:#fff; }
  .badge.p0{ background: transparent; color: var(--steel); border:1px solid var(--steel-line); }

  /* ---------- Tabelle ---------- */
  .board{
    border: 1px solid var(--iron);
    border-radius: 6px;
    overflow:hidden;
  }
  .board-head{
    background: var(--iron);
    color: var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; text-transform:uppercase; letter-spacing:0.08em;
    display:grid;
    grid-template-columns: 34px 1fr 54px 54px;
    padding: 9px 14px;
  }
  .board-row{
    display:grid;
    grid-template-columns: 34px 1fr 54px 54px;
    align-items:center;
    padding: 12px 14px;
    background:#FBF9F3;
    border-top: 1px solid var(--steel-line);
    font-size: 14px;
  }
  .board-row:nth-child(even){ background:#F5F1E6; }
  .rank{
    font-family:'Anton', sans-serif; font-size: 17px; color: var(--steel);
  }
  .board-row.rank1 .rank{ color: var(--red); }
  .board-row .name{ font-weight:600; }
  .board-row .name.me::after{
    content:' (du)'; font-weight:400; color: var(--steel); font-size:12px;
  }
  .board-row .pts{ font-family:'IBM Plex Mono', monospace; font-weight:600; text-align:center; }
  .board-row .hits{ font-family:'IBM Plex Mono', monospace; color: var(--steel); text-align:center; font-size:12.5px; }
  .board-row .rm{
    grid-column: 1 / -1;
    text-align:right;
    margin-top: 6px;
  }
  .board-row .rm button{
    background:none; border:1px solid var(--steel-line); color:var(--steel);
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    padding: 3px 8px; border-radius:3px; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .board-row .rm button:hover{ border-color: var(--red); color: var(--red); }
  .board-row .rm button.confirm-pending{
    background: var(--red); color:#fff; border-color: var(--red);
  }
  .board-row{ flex-wrap: wrap; }
  .board-empty{
    padding: 30px 20px; text-align:center; color: var(--steel); font-size: 13.5px;
  }
  .tabelle-refresh{
    display:flex; justify-content:flex-end; margin-bottom:10px;
  }
  .tabelle-refresh button{
    background:none; border:1px solid var(--steel-line); color: var(--steel);
    font-family:'IBM Plex Mono', monospace; font-size: 11px;
    padding: 5px 10px; border-radius:4px; cursor:pointer;
  }
  .tabelle-refresh button:hover{ border-color: var(--red); color: var(--red); }
  .tabelle-refresh button.spinning{ opacity:0.5; }

  .tipps-list{
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--steel-line);
    display:flex; flex-direction:column; gap:6px;
  }
  .tipps-row{
    display:flex; align-items:center; gap:8px;
    font-size: 13px;
  }
  .tipps-row.me .tipps-name{ color: var(--red); }
  .tipps-name{
    flex:1; font-weight:600; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tipps-val{
    font-family:'IBM Plex Mono', monospace; font-weight:600;
    min-width: 34px; text-align:center;
  }
  .tipps-row .badge{ padding: 2px 7px; font-size: 9.5px; }

  /* ---------- Ergebnisse pflegen ---------- */
  .res-plaque{
    background:#FBF9F3; border:1px solid var(--steel-line); border-radius:6px;
    padding: 12px 16px; margin-bottom: 10px;
  }
  .res-plaque .teams{ font-size: 13.5px; font-weight:600; margin-bottom:8px; }
  .res-plaque .teams .u{ color: var(--red); }
  .res-row{ display:flex; align-items:center; gap:8px; }
  .res-row input{
    width: 42px; height: 38px; text-align:center;
    font-family:'IBM Plex Mono', monospace; font-size: 16px;
    border: 1.5px solid var(--steel-line); border-radius:5px; background:#fff;
  }
  .res-row button{
    margin-left: auto;
    background: var(--iron); color:#fff; border:none;
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    padding: 8px 12px; border-radius:4px; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.05em;
  }
  .res-row button:hover{ background: var(--red); }
  .res-row .saved-tag{
    margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ok-green);
  }

  .info-note{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--steel);
    background: var(--paper-dim);
    border: 1px solid var(--steel-line);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 16px;
    line-height:1.5;
  }

  .points-legend{

// Bereinigt Schlüssel für Firebase-Pfade (erlaubt keine ':', '.', '#', '$', '[', ']')
function sanitizeFirebaseKey(key) {
  return encodeURIComponent(key).replace(/\./g, '%2E');
}

  async get(key, shared = true) {
    const safeKey = sanitizeFirebaseKey(key);
    const res = await fetch(`${FIREBASE_DB_URL}/tippspiel/${safeKey}.json`);
    if (!res.ok) throw new Error("Firebase GET Fehler");
    const data = await res.json();
    if (data === null) return null;

    return { value: typeof data === 'string' ? data : JSON.stringify(data) };
  },

  async set(key, value, shared = true) {
    const safeKey = sanitizeFirebaseKey(key);
    const res = await fetch(`${FIREBASE_DB_URL}/tippspiel/${safeKey}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(value)
    });
    if (!res.ok) throw new Error("Firebase SET Fehler");
    return true;
  }

  function isLocked(m){
    if(!m.kickoff) return false;
    return new Date() >= new Date(m.kickoff);
  }

  function isSeasonLocked(){
    var first = MATCHES[0];
    return isLocked(first);
  }

  function isMatchOver(m){
    if(!m.kickoff) return false;
    var end = new Date(m.kickoff).getTime() + 135*60*1000;
    return Date.now() >= end;
  }

  function isSeasonOver(){
    return isMatchOver(MATCHES[MATCHES.length - 1]);
  }

  function isMatchOverByDateFallback(m){
    if(m.kickoff) return isMatchOver(m);
    var mt = m.date.match(/(\d{2})\.(\d{2})\.(\d{4})/);
    if(!mt) return false;
    var end = new Date(parseInt(mt[3],10), parseInt(mt[2],10)-1, parseInt(mt[1],10), 23, 59, 59).getTime();
    return Date.now() >= end;
  }

  function isHinrundeOver(){
    var lastHinrundeMatch = MATCHES[16]; // 17. Spieltag
    return isMatchOverByDateFallback(lastHinrundeMatch);
  }

  function calcSonderPoints(tipPlatz, resPlatz){
    if(tipPlatz===undefined || tipPlatz===null || resPlatz===undefined || resPlatz===null) return null;
    var diff = Math.abs(tipPlatz - resPlatz);
    if(diff === 0) return 10;
    return Math.max(0, 10 - 2*diff);
  }

  function calcTorschuetzePoints(tipPlayer, resPlayer){
    if(!tipPlayer || !resPlayer) return null;
    return tipPlayer === resPlayer ? 5 : 0;
  }

  function calcPoints(tip, res){
    if(!tip || res===undefined || res===null) return null;
    if(tip.h===res.h && tip.a===res.a) return 3;
    var dt = tip.h - tip.a, dr = res.h - res.a;
    var tt = Math.sign(dt), tr = Math.sign(dr);
    if(tt !== tr) return 0;
    return 1;
  }

    Object.keys(saveTimers).forEach(function(mid){ clearTimeout(saveTimers[mid]); });

    if(sonderSaveTimer){
      clearTimeout(sonderSaveTimer); sonderSaveTimer = null;
      if(state.sonderTipp){
        try{
          await window.storage.set('sondertipp:' + keySafe(state.me), JSON.stringify(state.sonderTipp), true);

  var saveTimers = {};
  async function writeTipsWithRetry(retriesLeft){
    var result = null;
    try{
      result = await window.storage.set('tips:' + keySafe(state.me), JSON.stringify(state.tips), true);
    }catch(e){ result = null; }
    if(result){
      state.allTips[state.me] = state.tips;
      return true;
    }
    if(retriesLeft > 0){
      await new Promise(function(r){ setTimeout(r, 800); });
      return await writeTipsWithRetry(retriesLeft - 1);
    }
    // Letzter Ausweg: nachlesen, ob der Schreibvorgang trotz fehlender Bestätigung angekommen ist
    try{
      var check = await window.storage.get('tips:' + keySafe(state.me), true);
      if(check && check.value === JSON.stringify(state.tips)){
        state.allTips[state.me] = state.tips;
        return true;
      }
    }catch(e){}
    return false;
  }

    var freshList = await fetchPlayersFresh();

  function renderSonderTippCard(opts){

    var res = opts.res;

    var pts = res ? calcSonderPoints(myTip ? myTip.platz : null, res.platz) : null;

    if(res){
      var badge = pts===null ? '' : '<span class="badge ' + (pts>=10?'p4':(pts>0?'p2':'p0')) + '">' + pts + ' Pkt.</span>';
      html += '<div class="result-final">' +

        (myTip ? '<div class="yourtip">dein Tipp<br>' + myTip.platz + '.</div>' : '<div class="yourtip">kein Tipp<br>abgegeben</div>') +
        badge +
      '</div>';

  function renderTabelle(){
    var refreshBtn = '<div class="tabelle-refresh"><button id="refreshTabelleBtn">↻ Aktualisieren</button></div>';
    if(state.players.length === 0){
      return refreshBtn + '<div class="board"><div class="board-empty">Noch keine Teilnehmer. Sobald jemand tippt, erscheint hier die Tabelle.</div></div>';
    }
    var rows = state.players.map(function(p){
      var tips = state.allTips[p] || {};
      var total = 0, hits = 0, evaluated = 0;
      MATCHES.forEach(function(m){
        var res = state.results[m.id];
        if(!res) return;
        var pts = calcPoints(tips[m.id], res);
        if(pts !== null){ total += pts; evaluated++; if(pts===3) hits++; }
      });
      if(state.sonderResult){
        var sTip = state.allSonderTipps[p];
        var sPts = calcSonderPoints(sTip ? sTip.platz : null, state.sonderResult.platz);
        if(sPts !== null) total += sPts;
      }
      if(state.sonderResultHR){
        var sTipHR = state.allSonderTippsHR[p];
        var sPtsHR = calcSonderPoints(sTipHR ? sTipHR.platz : null, state.sonderResultHR.platz);
        if(sPtsHR !== null) total += sPtsHR;
      }
      if(state.sonderResultTS){
        var sTipTS = state.allSonderTippsTS[p];
        var sPtsTS = calcTorschuetzePoints(sTipTS ? sTipTS.player : null, state.sonderResultTS.player);
        if(sPtsTS !== null) total += sPtsTS;
      }
      return {name:p, total:total, hits:hits};
    });
    rows.sort(function(a,b){ return b.total - a.total || b.hits - a.hits || a.name.localeCompare(b.name); });

    var html = refreshBtn + '<div class="board">' +
      '<div class="board-head"><span>#</span><span>Name</span><span style="text-align:center">Pkt.</span><span style="text-align:center">3er</span></div>';
    rows.forEach(function(r, i){
      html += '<div class="board-row' + (i===0?' rank1':'') + '">' +
        '<div class="rank">' + (i+1) + '</div>' +
        '<div class="name' + (r.name===state.me?' me':'') + '">' + escapeHtml(r.name) + '</div>' +
        '<div class="pts">' + r.total + '</div>' +
        '<div class="hits">' + r.hits + '</div>' +
        (r.name===state.me ? '<div class="rm"><button data-remove="' + escapeHtml(r.name) + '">ENTFERNEN</button></div>' : '') +
      '</div>';
    });
    html += '</div>';
    return html;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){

    });

      };
    }
    var sonderSelectTS = document.getElementById('sonderSelectTS');
    if(sonderSelectTS){
      sonderSelectTS.onchange = function(){
        if(this.value !== '') queueSaveSonderTippTS(this.value);
      };
    }

    document.querySelectorAll('.tab').forEach(function(el){
      el.onclick = function(){
        var target = el.getAttribute('data-tab');
        state.tab = target;
        render();
        if(target === 'tabelle' || target === 'tipps'){
          refreshTabelle();
        }
      };
    });

    document.querySelectorAll('.score-row input').forEach(function(inp){
      inp.addEventListener('input', function(){
        var mid = this.getAttribute('data-match');
        var side = this.getAttribute('data-side');
        var row = this.closest('.score-row');
        var hIn = row.querySelector('[data-side="h"]');
        var aIn = row.querySelector('[data-side="a"]');
        var h = hIn.value === '' ? null : parseInt(hIn.value,10);
        var a = aIn.value === '' ? null : parseInt(aIn.value,10);
        var plaque = this.closest('.plaque');
        var rivet = plaque.querySelector('.rivet-status');
        var btn = row.querySelector('.tip-save-btn');
        if(h!==null && !isNaN(h) && a!==null && !isNaN(a)){
          queueSaveTip(mid, h, a);
          rivet.classList.add('set');
        } else {
          rivet.classList.remove('set');
        }
        if(btn){ btn.classList.remove('saved'); btn.classList.remove('error'); btn.textContent = 'Speichern'; }
      });
    });

    document.querySelectorAll('[data-save-tip]').forEach(function(btn){
      btn.onclick = async function(){
        var mid = this.getAttribute('data-save-tip');
        var row = this.closest('.score-row');
        var hIn = row.querySelector('[data-side="h"]');
        var aIn = row.querySelector('[data-side="a"]');
        var h = hIn.value === '' ? NaN : parseInt(hIn.value,10);
        var a = aIn.value === '' ? NaN : parseInt(aIn.value,10);
        if(isNaN(h) || isNaN(a)){ hIn.focus(); return; }
        clearTimeout(saveTimers[mid]);
        state.tips[mid] = {h:h, a:a};
        this.disabled = true;
        this.classList.remove('error'); this.classList.remove('saved');
        this.textContent = 'Speichert …';
        var ok = await writeTipsWithRetry(2);
        this.disabled = false;
        var plaque = this.closest('.plaque');
        var rivet = plaque.querySelector('.rivet-status');
        if(ok){
          if(rivet) rivet.classList.add('set');
          this.classList.add('saved');
          this.textContent = 'Gespeichert ✓';
        } else {
          this.classList.add('error');
          this.textContent = '⚠ Fehler – nochmal';
        }
      };
    });

    var refreshBtn = document.getElementById('refreshTabelleBtn');
    if(refreshBtn){
      refreshBtn.onclick = function(){
        this.classList.add('spinning');
        refreshTabelle();
      };
    }
    var refreshTippsBtn = document.getElementById('refreshTippsBtn');
    if(refreshTippsBtn){
      refreshTippsBtn.onclick = function(){
        this.classList.add('spinning');
        refreshTabelle();
      };
    }

    document.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.onclick = function(){
        var name = this.getAttribute('data-remove');
        if(this.classList.contains('confirm-pending')){
          clearTimeout(this._confirmTimer);
          this.disabled = true;
          this.textContent = 'Entfernt …';
          removePlayer(name);
        } else {
          this.classList.add('confirm-pending');
          this.textContent = 'Sicher? Nochmal klicken';
          var self = this;
          this._confirmTimer = setTimeout(function(){
            self.classList.remove('confirm-pending');
            self.textContent = 'ENTFERNEN';
          }, 4000);
        }
      };
    });

    document.querySelectorAll('[data-save-res]').forEach(function(btn){
      btn.onclick = function(){
        var mid = this.getAttribute('data-save-res');
        var plaque = this.closest('.res-plaque');
        var hIn = plaque.querySelector('[data-res-side="h"]');
        var aIn = plaque.querySelector('[data-res-side="a"]');
        var h = parseInt(hIn.value,10), a = parseInt(aIn.value,10);
        if(isNaN(h) || isNaN(a)){ hIn.focus(); return; }
        saveResult(mid, h, a);
      };
    });

    var saveSonderBtn = document.getElementById('saveSonderResBtn');
    if(saveSonderBtn){
      saveSonderBtn.onclick = function(){
        var sel = document.getElementById('sonderResSelect');
        var v = parseInt(sel.value, 10);
        if(isNaN(v)){ sel.focus(); return; }
        saveSonderErgebnis(v);
      };
    }
    var saveSonderBtnHR = document.getElementById('saveSonderResHRBtn');
    if(saveSonderBtnHR){
      saveSonderBtnHR.onclick = function(){
        var sel = document.getElementById('sonderResSelectHR');
        var v = parseInt(sel.value, 10);
        if(isNaN(v)){ sel.focus(); return; }
        saveSonderErgebnisHR(v);
      };
    }
    var saveSonderBtnTS = document.getElementById('saveSonderResTSBtn');
    if(saveSonderBtnTS){
      saveSonderBtnTS.onclick = function(){
        var sel = document.getElementById('sonderResSelectTS');
        if(sel.value === ''){ sel.focus(); return; }
        saveSonderErgebnisTS(sel.value);
      };
    }
  }

  loadAll();
})();
</script>
</body>
</html>
